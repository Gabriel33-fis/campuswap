# Nenhum segredo fica neste arquivo: os valores vêm do .env (local) ou das
# "Environment variables" da stack no Portainer. Veja o .env.example.
version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: gabriel_mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-campuswap_db}
      - MYSQL_USER=${MYSQL_USER:-campuswap_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - gabriel_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-campuswap_user}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tom_hanks_net

  redis:
    image: redis:7-alpine
    container_name: gabriel_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - tom_hanks_net

  log_service:
    build:
      context: https://github.com/Gabriel33-fis/campuswap.git#main:log_service
    container_name: gabriel_log_service
    restart: always
    command: sh -c "pip install requests redis prometheus-fastapi-instrumentator && uvicorn main:app --host 0.0.0.0 --port 6000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - redis
    networks:
      - tom_hanks_net

  auth_service:
    build:
      context: https://github.com/Gabriel33-fis/campuswap.git#main:auth_service
    container_name: gabriel_auth_service
    restart: always
    command: sh -c "pip install requests pymysql cryptography prometheus-fastapi-instrumentator stripe && uvicorn main:app --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-campuswap_user}:${MYSQL_PASSWORD}@mariadb:3306/${MYSQL_DATABASE:-campuswap_db}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_SERVICE_URL=http://log_service:6000
      - MAILTRAP_HOST=sandbox.smtp.mailtrap.io
      - MAILTRAP_PORT=2525
      - MAILTRAP_USER=${MAILTRAP_USER}
      - MAILTRAP_PASS=${MAILTRAP_PASS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - mariadb
      - log_service
    networks:
      - tom_hanks_net

  minio:
    image: minio/minio:latest
    container_name: gabriel_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - gabriel_minio_data:/data
    networks:
      - tom_hanks_net

  catalogo_service:
    build:
      context: https://github.com/Gabriel33-fis/campuswap.git#main:catalogo_service
      no_cache: true
    container_name: gabriel_catalogo_service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8207:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:5000
      - LOG_SERVICE_URL=http://log_service:6000
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-campuswap_user}:${MYSQL_PASSWORD}@mariadb:3306/${MYSQL_DATABASE:-campuswap_db}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=campuswap-fotos
      - MINIO_SECURE=false
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://gabriel-graciano-isw055.lapps.studio}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      - mariadb
      - redis
      - minio
    networks:
      - tom_hanks_net

volumes:
  gabriel_minio_data:
  gabriel_mariadb_data:

networks:
  tom_hanks_net:
    driver: bridge