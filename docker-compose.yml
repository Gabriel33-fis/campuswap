version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: gabriel_mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-campuswap_db}
      - MYSQL_USER=${MYSQL_USER:-campuswap_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-campuswap_pass}
    volumes:
      - gabriel_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-campuswap_user}", "-p${MYSQL_PASSWORD:-campuswap_pass}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tom_hanks_net

  redis:
    image: redis:7-alpine
    container_name: gabriel_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - tom_hanks_net

  log_service:
    build:
      context: ./log_service
    container_name: gabriel_log_service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 6000
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-chave_super_secreta_jwt_padrao}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - redis
    networks:
      - tom_hanks_net

  auth_service:
    build:
      context: ./auth_service
    container_name: gabriel_auth_service
    restart: always
    command: sh -c "pip install --no-cache-dir stripe && uvicorn main:app --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-campuswap_user}:${MYSQL_PASSWORD:-campuswap_pass}@mariadb:3306/${MYSQL_DATABASE:-campuswap_db}
      - JWT_SECRET=${JWT_SECRET:-chave_super_secreta_jwt_padrao}
      - LOG_SERVICE_URL=http://log_service:6000
      - MAILTRAP_HOST=sandbox.smtp.mailtrap.io
      - MAILTRAP_PORT=2525
      - MAILTRAP_USER=${MAILTRAP_USER:-test}
      - MAILTRAP_PASS=${MAILTRAP_PASS:-test}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_mock}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-price_mock}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_mock}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - mariadb
      - log_service
    networks:
      - tom_hanks_net

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: gabriel_minio
    restart: always
    working_dir: /data
    command: ["sh", "-c", "mkdir -p /data/campuswap-fotos && echo 'Bucket campuswap-fotos pronto' > /data/index.html && python3 -m http.server 9000"]
    ports:
      - "9000:9000"
      - "9001:9000"
    volumes:
      - gabriel_minio_data:/data
    networks:
      - tom_hanks_net

  catalogo_service:
    build:
      context: ./catalogo_service
    container_name: gabriel_catalogo_service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8207:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:5000
      - LOG_SERVICE_URL=http://log_service:6000
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-campuswap_user}:${MYSQL_PASSWORD:-campuswap_pass}@mariadb:3306/${MYSQL_DATABASE:-campuswap_db}
      - JWT_SECRET=${JWT_SECRET:-chave_super_secreta_jwt_padrao}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=miniopassword123
      - MINIO_BUCKET_NAME=campuswap-fotos
      - MINIO_SECURE=false
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_mock}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://gabriel-graciano-isw055.lapps.studio}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      - mariadb
      - redis
      - minio
    networks:
      - tom_hanks_net

volumes:
  gabriel_minio_data:
  gabriel_mariadb_data:

networks:
  tom_hanks_net:
    driver: bridge