version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: gabriel_mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=fatec_root_2026
      - MYSQL_DATABASE=campuswap_db
      - MYSQL_USER=campuswap_user
      - MYSQL_PASSWORD=campuswap_pass
    ports:
      - "3306:3306"
    volumes:
      - gabriel_mariadb_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - campuswap_net

  redis:
    image: redis:7-alpine
    container_name: gabriel_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - campuswap_net

  log_service:
    build:
      context: https://github.com/Gabriel33-fis/campuswap.git#main:log_service
    container_name: gabriel_log_service
    restart: always
    command: sh -c "pip install requests redis prometheus-fastapi-instrumentator && uvicorn main:app --host 0.0.0.0 --port 6000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=chave_super_secreta_jwt_padrao
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - redis
    networks:
      - campuswap_net

  auth_service:
    build:
      context: https://github.com/Gabriel33-fis/campuswap.git#main:auth_service
    container_name: gabriel_auth_service
    restart: always
    command: sh -c "pip install requests pymysql cryptography prometheus-fastapi-instrumentator stripe && uvicorn main:app --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://campuswap_user:campuswap_pass@mariadb:3306/campuswap_db
      - JWT_SECRET=chave_super_secreta_jwt_padrao
      - LOG_SERVICE_URL=http://log_service:6000
      - MAILTRAP_HOST=sandbox.smtp.mailtrap.io
      - MAILTRAP_PORT=2525
      - MAILTRAP_USER=891b6bf689d033
      - MAILTRAP_PASS=a6056f6ec19f20
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mariadb:
        condition: service_healthy
      log_service:
        condition: service_started
    networks:
      - campuswap_net

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: gabriel_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=miniopassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gabriel_minio_data:/data
    networks:
      - campuswap_net

  catalogo_service:
    build:
      context: https://github.com/Gabriel33-fis/campuswap.git#main:catalogo_service
    container_name: gabriel_catalogo_service
    restart: always
    command: sh -c "pip install requests pymysql redis prometheus-fastapi-instrumentator minio python-multipart && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8207:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:5000
      - LOG_SERVICE_URL=http://log_service:6000
      - DATABASE_URL=mysql+pymysql://campuswap_user:campuswap_pass@mariadb:3306/campuswap_db
      - JWT_SECRET=chave_super_secreta_jwt_padrao
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=miniopassword123
      - MINIO_BUCKET_NAME=campuswap-fotos
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      mariadb:
        condition: service_healthy
      auth_service:
        condition: service_started
      log_service:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - campuswap_net

volumes:
  gabriel_minio_data:
  gabriel_mariadb_data:

networks:
  campuswap_net:
    driver: bridge