<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampuSwap — Marketplace Universitário</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Cabeçalho de Navegação -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">📦 CampuSwap</h1>
            <nav id="nav-actions">
                <button onclick="mostrarLogin()" class="bg-white text-indigo-700 font-semibold px-4 py-2 rounded-lg shadow hover:bg-gray-100 transition">Entrar / Registar</button>
            </nav>
        </div>
    </header>

    <!-- Secção Pública (Landing Page) -->
    <section id="landing-hero" class="py-16 bg-gradient-to-r from-indigo-600 to-indigo-800 text-white text-center px-4">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-4xl font-extrabold mb-4">O marketplace colaborativo do seu campus</h2>
            <p class="text-lg text-indigo-100 mb-8">
                Compre, venda, troque ou peça livros, calculadoras e materiais académicos emprestados diretamente a outros estudantes.
            </p>
            <button onclick="mostrarCadastro()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-lg text-lg shadow-lg transition">Criar Conta Gratuita</button>
        </div>
    </section>

    <!-- Vitrine Principal de Materiais -->
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold text-gray-800">Materiais Disponíveis no Campus</h3>
            <button onclick="abrirModalNovoItem()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700">+ Anunciar Material</button>
        </div>

        <!-- Grade de Produtos -->
        <div id="grid-itens" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Renderizado dinamicamente via JavaScript com /api/itens -->
        </div>
    </main>

    <script>
        const API_URL = '/api';

        async function carregarItens() {
            try {
                const res = await fetch(`${API_URL}/itens`);
                const itens = await res.json();
                const grid = document.getElementById('grid-itens');
                grid.innerHTML = '';

                if (itens.length === 0) {
                    grid.innerHTML = '<p class="text-gray-500 col-span-3">Nenhum material anunciado no momento.</p>';
                    return;
                }

                itens.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col justify-between p-5";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs uppercase font-bold tracking-wider px-2 py-1 bg-indigo-100 text-indigo-800 rounded">${item.modalidade}</span>
                                <span class="text-sm font-semibold text-green-600">${item.preco > 0 ? 'R$ ' + item.preco.toFixed(2) : 'Grátis / Troca'}</span>
                            </div>
                            <h4 class="text-lg font-bold text-gray-900 mb-2">${item.titulo}</h4>
                            <p class="text-sm text-gray-600 mb-4">${item.descricao}</p>
                        </div>
                        <div class="border-t pt-3 flex justify-between items-center">
                            <span class="text-xs text-gray-400 capitalize">Condição: ${item.condicao.replace('_', ' ')}</span>
                            <button onclick="verDetalhes(${item.id})" class="text-indigo-600 font-semibold text-sm hover:underline">Ver detalhes</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Erro ao carregar catálogo:", err);
            }
        }

        document.addEventListener('DOMContentLoaded', carregarItens);
    </script>
</body>
</html>
