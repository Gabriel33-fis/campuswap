name: CI/CD - CampuSwap

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  # CI: compila o codigo e roda os testes automatizados (pytest) de cada servico
  test:
    name: CI - Verificacao do codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar dependencias dos tres servicos
        run: |
          python -m pip install --upgrade pip
          pip install -r auth_service/requirements.txt
          pip install -r catalogo_service/requirements.txt
          pip install -r log_service/requirements.txt
          pip install pytest httpx
      - name: Compilar o codigo Python
        run: python -m compileall -q auth_service catalogo_service log_service
      # Cada servico tem modulos com o mesmo nome (main, models...), entao os testes rodam separados
      - name: Testes - auth_service
        working-directory: auth_service
        run: python -m pytest -q
      - name: Testes - catalogo_service
        working-directory: catalogo_service
        run: python -m pytest -q

  # CD: constroi as tres imagens e publica no GHCR
  build-and-push:
    name: CD - Build e publicacao no GHCR
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth_service, catalogo_service, log_service]
    steps:
      - uses: actions/checkout@v6
      - name: Nome do repositorio em minusculas e SHA curto
        id: vars
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.vars.outputs.repo }}/${{ matrix.service }}:sha-${{ steps.vars.outputs.sha }}
